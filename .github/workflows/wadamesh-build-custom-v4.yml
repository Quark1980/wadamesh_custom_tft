name: Build Custom Heltec V4 (wadamesh fork)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "variants/**"
      - "platformio.ini"
      - ".github/workflows/wadamesh-build-custom-v4.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "variants/**"
      - "platformio.ini"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - heltec_v4_tft_companion_radio_usb_tcp_touch
          - heltec_v4_grid_custom_touch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/*.bin
            .pio/build/${{ matrix.environment }}/*.elf
            .pio/build/${{ matrix.environment }}/*.map
          if-no-files-found: warn
